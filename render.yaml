services:
  - type: web
    name: fixmytown-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: pip install .
    startCommand: uvicorn wardwatch_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
